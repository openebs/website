# Trivial comment bump to force a fresh Netlify build for PR #605 — the DCO-fix
# rebase left the tree content identical to an already-built commit, so Netlify's
# change detection was skipping the rebuild. Safe to remove after the preview builds.
[build]
  base = "website/"
  publish = "build/"
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "24"

#https://answers.netlify.com/t/forwarding-subdomain-to-a-path/2988
  
[[redirects]]
  from = "https://docs.openebs.io/*"
  to = "https://openebs.io/docs/"
  status = 301
  force = true
  
#https://stackoverflow.com/questions/58065603/netlify-renders-404-on-page-refresh-using-react-and-react-router 

[[redirects]]
  from = "/docs/*"
  to = "https://relaxed-hodgkin-06d937.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  
